[build]
builder = "DOCKERFILE"

[deploy]
# Let Dockerfile CMD handle the start command (uses start.sh script)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Persistent volume for database and FAISS indexes
# You must create this volume in Railway UI: Settings → Volumes → Add Volume
# Mount path: /data
# This ensures SQLite database persists across restarts
